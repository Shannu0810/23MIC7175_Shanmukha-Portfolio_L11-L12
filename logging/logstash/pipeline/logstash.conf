input {
  beats {
    port => 5044
  }
  tcp {
    port => 50000
    codec => json_lines
  }
}

filter {
  if [service] == "portfolio-auth-service" {
    mutate {
      add_tag => [ "portfolio_app_log" ]
    }
  }

  date {
    match => [ "timestamp", "YYYY-MM-DD HH:mm:ss.SSS", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "portfolio-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
