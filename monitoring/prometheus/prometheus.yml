global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'portfolio-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['portfolio-backend:5000']
        labels:
          app: 'portfolio-auth'
          env: 'production'

  - job_name: 'portfolio-frontend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['portfolio-frontend:80']
        labels:
          app: 'portfolio-web'
          env: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
